# Configuration for Customer Support Automation System

# Data paths
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  synthetic_dir: "data/synthetic"
  
# Model configuration
models:
  intent_classifier:
    model_name: "distilbert-base-uncased"
    max_length: 128
    batch_size: 32
    learning_rate: 2e-5
    num_epochs: 3
    
  ner_model:
    model_name: "en_core_web_sm"
    confidence_threshold: 0.8
    
  similarity_model:
    model_name: "sentence-transformers/all-MiniLM-L6-v2"
    similarity_threshold: 0.7

# Evaluation metrics
evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "response_time"
    - "customer_satisfaction"
  
  test_split: 0.2
  validation_split: 0.2
  random_seed: 42

# Business constraints
constraints:
  max_response_time: 5.0  # seconds
  min_confidence_threshold: 0.7
  escalation_threshold: 0.5
  max_automation_rate: 0.8  # Max 80% automated responses

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/support_automation.log"

# API configuration
api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  
# Demo configuration
demo:
  streamlit:
    port: 8501
    theme: "light"
  gradio:
    port: 7860
    share: false
